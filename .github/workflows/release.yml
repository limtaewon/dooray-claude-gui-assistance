name: Release

on:
  push:
    tags:
      - 'v*'          # v1.0.0 같은 태그 push 시 자동 실행
  workflow_dispatch:   # GitHub 웹에서 수동 실행도 가능

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (node-gyp distutils 호환)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Build Windows exe
        run: npm run dist:win -- --publish never
        env:
          VITE_FEEDBACK_HOOK_URL: ${{ secrets.DOORAY_ULTRA_HOOK_URL }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # latest.yml 은 앱 안의 자동 업데이트가 "최신 버전이 무엇인지" 읽는 메타파일이다.
          # 이게 빠지면 exe 는 올라가도 기존 사용자는 새 버전을 영영 못 받는다.
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (수동 실행 시)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Clauday-Windows
          path: release/*.exe
          retention-days: 7
